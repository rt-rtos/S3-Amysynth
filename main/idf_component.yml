## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  # # For local components:
  # espressif/usb_device_uac is vendored at components/usb_device_uac
  # (LOCAL EDIT: deeper EP-IN software FIFO); do not re-add the registry dep.
  # The component manager DOES resolve the vendored copy's own manifest, so its
  # deps (tinyusb, cmake_utilities) land in dependencies.lock regardless of
  # this file - that manifest, plus button's private dep on cmake_utilities, is
  # why cmake_utilities reinstalls even when removed here. The tinyusb pin
  # below is therefore redundant with the vendored manifest's identical
  # constraint; kept as an explicit statement of the version we build against.
  # 0.19 is REQUIRED: its audio class re-arms the ISO IN endpoint in ISR
  # context, fixing the 0.17 tud_task re-arm race that dropped ~0.74
  # frames/s (1 ms host-inserted silence about once a second; see
  # UAC-EDITS.md). 0.19.0~3 still PREDATES the
  # hathach/tinyusb#3809 EP-IN flow-control guard fix (inverted
  # norminal <= depth*4); harmless at our >=4-packet FIFO depth, but on
  # any bump verify audiod_tx_packet_size() carries the corrected guard
  # (nominal*4 <= depth) before trusting small-FIFO configs. Managed
  # components are hash-checked - never patch them in place; that is why
  # usb_device_uac is vendored.
  espressif/tinyusb: '^0.19.0~3'
  espressif/button: =*
  joltwallet/littlefs: "==1.*"
